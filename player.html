<!DOCTYPE html>

	<div class="albums">

		<div class="album">
		  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6t1YEt9JFsNHmeDA3z1Xa9Hn6zttesfi2wseO5h8i675xaEdGjei5-Lo&s=10">
		  <p>A Fina Flor da Grossura - Mano Lima</p>
		</div>
	  
		<div class="album">
		  <img src="https://akamai.sscdn.co/letras/360x360/albuns/6/2/b/d/721151689002806.jpg">
		  <p>Troveiro do Mbororé - Mano Lima</p>

		<div class="album">

		  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8UeAAhdryKSg9b6HXghr3hhJ-ZM8Sj6QIJIxgmOUUx3qeFo7CJw0aNWw&s=10">
	  
		  <div>

		</div>
	  
		<div class="controls">
		  <button>⏮</button>
		  <button>▶</button>
		  <button>⏭</button>
		</div>
	  
		<div class="progress">
		  <span>1:35</span>
		  <input type="range" value="30">

	  </div>
